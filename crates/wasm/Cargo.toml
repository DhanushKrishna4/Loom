[package]
name    = "nano-infer-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "wasm-bindgen boundary for nano-infer. Marshalling only -- no logic."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` keeps core in its no_std configuration, which is
# what we ship. If this ever fails to build, core has grown a std dependency it
# should not have.
nano-infer-core = { path = "../core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# wasm-pack runs wasm-opt itself; tell it to use the same flags the hand-rolled
# build used, or SIMD instructions get stripped and the module silently loses
# the 2.5x from step 9.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory"]
